name: deploy-scaler-code

on:
  workflow_dispatch:
    inputs:
      function_app_name:
        type: string
        required: true
      resource_group:
        type: string
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2.0.0
        with:
          creds: ${{ secrets.TDEI_CORE_AZURE_CREDS }}

      - name: Create deployment zip
        shell: bash
        run: |
          zip -r /tmp/functionapp.zip . \
            -x ".git/*" ".github/*" ".venv/*" "tests/*" "__pycache__/*"

      - name: Deploy code to Function App
        shell: bash
        run: |
          # Flex Consumption + Python needs remote build (see MS Flex how-to docs).
          az functionapp deployment source config-zip \
            --name "${{ inputs.function_app_name }}" \
            --resource-group "${{ inputs.resource_group }}" \
            --src /tmp/functionapp.zip \
            --build-remote true

      # Record which commit the app now runs, as tags: the TDEI quality dashboard's Reader identity
      # can read tags but not app settings. Tags go through Azure's management API, so this works
      # even while the app's public network access is disabled.
      - name: Tag the Function App with the deployed commit
        shell: bash
        env:
          FUNCTION_APP_NAME: ${{ inputs.function_app_name }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
        run: |
          app_id=$(az functionapp show --name "$FUNCTION_APP_NAME" --resource-group "$RESOURCE_GROUP" --query id -o tsv)
          az tag update --resource-id "$app_id" --operation Merge -o none --tags \
            "deployed_commit=$GITHUB_SHA" \
            "deployed_from=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
